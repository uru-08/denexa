<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyecto X</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, Helvetica, sans-serif;

    background:#f5f5f5;

    color:#222;

}

header{

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#1b4332,#2d6a4f);

    color:white;

    text-align:center;

}

h1{

    font-size:60px;

    margin-bottom:20px;

}

p{

    font-size:22px;

    opacity:.9;

}

button{

    margin-top:40px;

    padding:18px 40px;

    border:none;

    border-radius:50px;

    background:white;

    color:#1b4332;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.05);

}

</style>

</head>

<body>

<header>

<h1>PROYECTO X</h1>

<p>La nueva generación de plataformas de pedidos.</p>

<button>Comenzar</button>

</header>

</body>

</html>
