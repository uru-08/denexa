<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b42318">
  <title>Mamma Mia | Pedidos</title>
  <meta
    name="description"
    content="Hac&eacute; tu pedido online en Mamma Mia."
  >
  <link rel="stylesheet" href="css/app.css?v=25">
</head>

<body>

  <div id="appShell" class="app-shell">

    <header class="store-header">
      <div class="store-header-overlay"></div>

      <div class="store-header-content">
        <div id="storeLogo" class="store-logo" aria-hidden="true">MM</div>

        <div class="store-heading">
          <p class="store-kicker">PEDIDOS ONLINE</p>
          <h1 id="storeName">Mamma Mia</h1>
          <p id="storeSubtitle" class="store-subtitle">
            Eleg&iacute; tus favoritos y arm&aacute; tu pedido.
          </p>
        </div>

        <div id="storeStatus" class="store-status">Cargando...</div>
      </div>
    </header>

    <main class="main-content">

      <section class="store-info-card">
        <div>
          <span class="info-label">Comercio</span>
          <strong id="storeNameSmall">Mamma Mia</strong>
        </div>

        <div>
          <span class="info-label">Pedido</span>
          <strong>Delivery o retiro</strong>
        </div>
      </section>

      <section class="catalog-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MEN&Uacute;</p>
            <h2>Eleg&iacute; qu&eacute; quer&eacute;s pedir</h2>
          </div>
        </div>

        <div id="categoryTabs" class="category-tabs" aria-label="Categor&iacute;as"></div>

        <div id="catalogContent" class="catalog-content">
          <div class="loading-card">
            Cargando el men&uacute;...
          </div>
        </div>
      </section>

    </main>

    <button id="cartButton" class="floating-cart" type="button" aria-label="Abrir carrito">
      <span>
        <strong>Ver pedido</strong>
        <small id="cartCount">0 productos</small>
      </span>

      <strong id="cartTotal">$0</strong>
    </button>

  </div>

  <div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-product></div>

    <div class="modal-card product-modal-card" role="dialog" aria-modal="true">
      <button id="closeProductButton" class="modal-close" type="button" aria-label="Cerrar">
        &times;
      </button>

      <div id="productModalContent"></div>
    </div>
  </div>

  <div id="cartModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-cart></div>

    <div class="modal-card cart-modal-card" role="dialog" aria-modal="true">
      <div class="modal-title-row">
        <div>
          <p class="eyebrow">TU PEDIDO</p>
          <h2>Carrito</h2>
        </div>

        <button id="closeCartButton" class="modal-close inline-close" type="button" aria-label="Cerrar">
          &times;
        </button>
      </div>

      <div id="cartItems" class="cart-items"></div>

      <div class="cart-summary">
        <div>
          <span>Total</span>
          <strong id="cartModalTotal">$0</strong>
        </div>

        <button id="continueOrderButton" class="primary-action" type="button">
          Continuar pedido
        </button>

        <p class="cart-note">
          En el pr&oacute;ximo paso conectaremos entrega, pago y confirmaci&oacute;n del pedido.
        </p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="js/config.js?v=25"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
