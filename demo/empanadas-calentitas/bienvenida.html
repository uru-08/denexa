<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<title>Empanadas Calentitas · Bienvenidos</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#050706;
}
body{
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}
.welcome{
  min-height:100svh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:#050706;
}
.poster{
  position:relative;
  width:min(100vw,680px);
  margin:0 auto;
}
.poster img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
}
.enter{
  position:absolute;
  left:10%;
  right:10%;
  top:72%;
  height:10%;
  border:0;
  border-radius:28px;
  background:transparent;
  cursor:pointer;
  font-size:0;
  -webkit-tap-highlight-color:transparent;
}
.enter:focus-visible{
  outline:3px solid #fff;
  outline-offset:4px;
}

/* En móvil, eliminamos el espacio negro sobrante:
   la página mide lo que mide la imagen. */
@media(max-width:699px){
  html,body,.welcome{
    min-height:0;
    height:auto;
  }
  .welcome{
    display:block;
  }
  .poster{
    width:100vw;
  }
}

/* En pantallas grandes mantenemos una presentación centrada */
@media(min-width:700px){
  .welcome{
    min-height:100svh;
    align-items:center;
    padding:24px;
  }
  .poster{
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 24px 70px #000;
  }
}
</style>
</head>
<body>
<main class="welcome">
  <div class="poster">
    <img
      src="https://raw.githubusercontent.com/uru-08/denexa/main/demo/empanadas-calentitas/assets/bienvenida-calentitas.png?v=3"
      alt="Bienvenidos a Empanadas Calentitas. Nuestro menú online."
    >
    <button
      class="enter"
      type="button"
      aria-label="Hacer mi pedido"
      onclick="location.href='index.html'"
    >
      Hacer mi pedido
    </button>
  </div>
</main>
</body>
</html>
