<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<title>Empanadas Calentitas · Bienvenidos</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#050706;
}
body{
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}
.welcome{
  width:100%;
  display:flex;
  justify-content:center;
  background:#050706;
}
.poster{
  position:relative;
  width:min(100vw,680px);
  margin:0 auto;
}
.poster img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
}
.enter{
  position:absolute;
  left:9%;
  right:9%;
  top:49.4%;
  height:10.4%;
  border:0;
  border-radius:30px;
  background:transparent;
  cursor:pointer;
  font-size:0;
  -webkit-tap-highlight-color:transparent;
}
.enter:focus-visible{
  outline:3px solid #fff;
  outline-offset:4px;
}
@media(min-width:700px){
  .welcome{
    min-height:100vh;
    align-items:center;
    padding:24px;
  }
  .poster{
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
}
</style>
</head>
<body>
<main class="welcome">
  <div class="poster">
    <img
      src="assets/bienvenida-calentitas.png"
      alt="Bienvenidos a Empanadas Calentitas. Nuestro menú online."
    >
    <button
      class="enter"
      type="button"
      aria-label="Hacer mi pedido"
      onclick="location.href='index.html'"
    >
      Hacer mi pedido
    </button>
  </div>
</main>
</body>
</html>
