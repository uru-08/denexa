<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyecto X | Super Panel</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <h2>PROYECTO X</h2>
        <span>Super Panel</span>
    </div>

    <ul>

        <li class="active">📊 Dashboard</li>
        <li>🏪 Comercios</li>
        <li>📦 Pedidos</li>
        <li>📂 Categorías</li>
        <li>🍔 Productos</li>
        <li>👥 Usuarios</li>
        <li>💳 Planes</li>
        <li>⚙ Configuración</li>

    </ul>

</div>

<div class="main">

    <header>
        <h1>Dashboard</h1>
    </header>

    <div class="cards">

        <div class="card">
            <h3>Comercios</h3>
            <p id="businesses">0</p>
        </div>

        <div class="card">
            <h3>Pedidos Hoy</h3>
            <p id="ordersToday">0</p>
        </div>

        <div class="card">
            <h3>Usuarios</h3>
            <p id="users">0</p>
        </div>

        <div class="card">
            <h3>Ventas</h3>
            <p id="sales">$0</p>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
